<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | Колко каси да отворим?</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="wrap">
      <a class="site-title" href="{{ url_for('pages.simulation') }}">Колко каси да отворим?</a>
      <nav>
        <a href="{{ url_for('pages.simulation') }}"
           class="{{ 'active' if request.endpoint == 'pages.simulation' }}">Симулация</a>
        <a href="{{ url_for('pages.cashiers') }}"
           class="{{ 'active' if request.endpoint == 'pages.cashiers' }}">Колко каси?</a>
        <a href="{{ url_for('pages.model') }}"
           class="{{ 'active' if request.endpoint == 'pages.model' }}">За модела</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="wrap">Курсова работа, Стелиан Миков, 2026</footer>
</body>
</html>
